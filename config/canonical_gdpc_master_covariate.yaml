version: v20260509
description: Canonical climate-index source and post-processing contract for the future GDPC1 master covariate.
artifact_root: data/canonical_gdpc_master/v20260509
canonical_window:
  start_date: '1987-05-29'
  end_date: '2023-01-22'
monthly_source_window:
  start_month: '1987-01-01'
  end_month: '2023-01-01'
download:
  timeout_seconds: 30
  retries: 3
  user_agent: canonical-gdpc-climate-pipeline/20260509
postprocess:
  interpolation:
    method: cubic_spline_with_linear_tail
    linear_tail_days: 30
    require_monthly_coverage_through_end_month: true
  standardization:
    method: zscore
    ddof: 1
gdpc:
  method: gdpc
  component_name: GDPC1
  k: 2
  tol: 1.0e-3
  niter_max: 200
  crit: BIC
  require_convergence: true
  blas_threads: 8
  sign_rule:
    method: positive_correlation
    anchor_index_id: oni
screening:
  enabled: true
  candidate_k_values:
    - 1
    - 2
    - 3
  criterion: BIC
  tol: 1.0e-3
  niter_max: 200
  max_runtime_seconds_per_k: 900
  require_convergence: false
  selection_rule:
    primary_metric: criterion_value
    objective: minimize
    require_converged_fit: true
    tie_breakers:
      - lower_runtime_seconds
      - smaller_k
compatibility_aliases:
  - alias_filename: cov_03_PCA.csv
    value_column: Static_PCA
  - alias_filename: cov_05_PCA.csv
    value_column: Static_PCA
indices:
  - index_id: nino3
    display_name: Nino 3
    url: https://psl.noaa.gov/data/correlation/nina3.anom.data
  - index_id: nao
    display_name: NAO
    url: https://psl.noaa.gov/data/correlation/nao.data
