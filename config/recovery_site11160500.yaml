families:
  - id: "nwm_retrospective"
    label: "NWS/NWM retrospective streamflow"
    versions: ["1.2", "2.0", "2.1", "3.0"]
  - id: "glofas_historical"
    label: "GLOFAS historical and legacy reanalysis"
    versions: ["version_2_1", "version_3_1", "version_4_0", "legacy_v3_0", "legacy_v4_0"]
  - id: "glofas_operational_forecasts"
    label: "GLOFAS operational medium-range forecast cache rebuild"
    versions: ["operational"]
    issue_window: ["2019-11-05", "2023-01-31"]
  - id: "climate_covariates"
    label: "PRISM precipitation and ERA5 soil moisture"
    versions: ["prism_ppt", "era5_soil", "nwm_retro_soil_aux"]
  - id: "gefs_forecasts"
    label: "GEFS precipitation and soil-moisture forecasts"
    init_dates: ["2021-01-23", "2021-11-12", "2021-12-21", "2022-05-11", "2022-12-25"]
  - id: "nws_operational_results_archive"
    label: "Recovered and reproducible NWS/NWM operational results archive"
    versions: ["results_pkl_operational_archive"]
  - id: "usgs_daily_flow"
    label: "USGS NWIS daily flow"
    versions: ["00060_00003"]

