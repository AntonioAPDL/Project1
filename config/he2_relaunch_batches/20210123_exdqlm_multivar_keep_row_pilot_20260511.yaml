                  init:
                    mode: robust
                    gamma: 0.0
                    sigma_floor: 0.01
                    sigma_scale: 0.5
                  stabilization:
                    median_state_hold_after_guard_iters: 10
                    median_state_blend_alpha: 1.0
                    median_cov_blend_alpha: 1.0
