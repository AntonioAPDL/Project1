spec_id: al_m_t0_p5_q65_q80_warmup40_postsave_highdf_eps365_cf1_20260606
description: >
  Targeted AL-M-T0 P5 repair overlay after the warmup-20 q65/q80 diagnostic
  showed q65 passing but 20210123 q80 still failing after successful sampling
  and RData save in the optional post-save objective diagnostic. The
  scientific/input contract is identical to P4: promoted exAL-M-T0 canonical
  bundle, AL likelihood, transfer drop, full transfer design, high discount
  factors, epsilon 365, and c_factor 1. P5 extends q65/q80 gamma-sigma warm-up
  freeze to 40 iterations and relies on the tracked post-save objective
  diagnostic hardening so a non-PD diagnostic covariance is logged rather than
  invalidating a saved fit.
requires_user_discount_decision: false

diagnostic_evidence:
  p4_warmup20_repair_note: docs/he2_al_m_t0_p4_q65_q80_warmup20_repair_note_20260606.md
  p4_warmup20_runtime_summary: reports/he2_al_m_t0_p4_warmup20_repair_q65q80_20260606/WARMUP20_REPAIR_Q65Q80_SUMMARY.md
  q80_failed_fit_log: /data/muscat_data/jaguir26/project1_ucsc_phd_runtime/multimodel_v8_he2_dqlm_multivar_al_drop_p4_warmup20_repair_q65q80_20260606/runs/multimodel_20210123_v8_he2pubgdpc1r1_dqlm_multivar_al_drop_warmup20_q80_fitonly_20260606/fit/q=80/logs/fit.log
  q65_passed_fit_log: /data/muscat_data/jaguir26/project1_ucsc_phd_runtime/multimodel_v8_he2_dqlm_multivar_al_drop_p4_warmup20_repair_q65q80_20260606/runs/multimodel_20211221_v8_he2pubgdpc1r1_dqlm_multivar_al_drop_warmup20_q65_fitonly_20260606/fit/q=65/logs/fit.log

promotion_gate:
  isolated_fit_cutoff: "20210123"
  isolated_fit_quantile: 0.80
  smoke_cutoffs:
    - "20210123"
    - "20211221"
  full_cutoffs:
    - "20210123"
    - "20211112"
    - "20211221"
    - "20220511"
    - "20221225"
  require_terminal_health_pass: true
  require_min_gamma_sigma_updates: 50
  require_two_cycle_free: true
  require_post_crps: true
  require_publication_figure_manifest: true
  require_post_success_rdata_cleanup: true
  keep_failed_rows_visible: true

state_evolution:
  df_t: 0.99999999
  df_s1: 0.99999999
  df_s2: 0.99999999
  df_s67: 0.99999999
  df_discrep: 0.99999999
  lambda: 0.97
  df_trans: 0.99999999
  df_covs: 0.99999999

forecast_cov:
  epsilon: 365.0
  c_factor: 1.0

gamma_sigma:
  max_iter: 160
  min_update_iters: 50
  min_total_iters: 50
  quantile_overrides:
    q35:
      freeze_target: gamma_sigma
      warmup_freeze_iters: 5
      terminal_sampling_guard:
        mode: fail_fast
        min_guard_count: 1
        max_guard_lag_iters: 0
        require_frozen: true
      stabilization:
        state_guard_enabled: true
        state_norm_max_ratio: 25
        state_norm_abs_cap: 1.0e12
        state_guard_start_iter: 0
        state_guard_refreeze_iters: 10
        state_hold_after_guard_iters: 10
        state_blend_alpha: 1.0
        cov_blend_alpha: 1.0
    q65:
      max_iter: 220
      freeze_target: gamma_sigma
      warmup_freeze_iters: 40
      terminal_sampling_guard:
        mode: fail_fast
        min_guard_count: 1
        max_guard_lag_iters: 0
        require_frozen: true
      stabilization:
        state_guard_enabled: true
        state_norm_max_ratio: 25
        state_norm_abs_cap: 1.0e12
        state_guard_start_iter: 0
        state_guard_refreeze_iters: 2
        state_hold_after_guard_iters: 0
        state_blend_alpha: 0.15
        cov_blend_alpha: 0.5
    q80:
      freeze_target: gamma_sigma
      warmup_freeze_iters: 40

gamma_sigma_drop_quantile_overrides:
  - q50
gamma_sigma_disallow_freeze_target_states: true

legacy:
  n_samp: 2000
