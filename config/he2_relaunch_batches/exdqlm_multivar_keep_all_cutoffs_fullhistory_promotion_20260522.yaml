selection:
  cutoffs:
    - '20210123'
    - '20211112'
    - '20211221'
    - '20220511'
    - '20221225'
  families:
    - exdqlm_multivar_keep
  model_classes:
    - quantile_multivariate

resources:
  fit_parallel_workers: 7
  mc_cores: 7

queue:
  ordinary_max_concurrent: 5
  heavy_cutoff_max_concurrent: 1
  heavy_cutoff_blocks_ordinary: false

overrides:
  row_config_patches:
    - family: exdqlm_multivar_keep
      manuscript_label: exAL-M-T1
      config_patch:
        run:
          threads:
            omp: 1
            openblas: 1
            mkl: 1
            veclib: 1
            numexpr: 1
        inputs:
          transfer_function_covariates:
            base_covariates:
              - PPT
              - SOIL
              - PCA
            engineered_terms:
              - PPT_sq
              - SOIL_sq
              - PPT_x_SOIL
              - PPT_lag1
              - PPT_lag2
              - PPT_lag3
              - SOIL_lag1
              - SOIL_lag2
              - SOIL_lag3
        models:
          exdqlm_multivar:
            forecast_transfer_mode: keep
            structure:
              include_trend: true
              enabled_harmonic_indices: [1, 2, 3]
            state_evolution:
              df_t: 0.99999
              df_s1: 0.9999
              df_s2: 0.9999
              df_s67: 0.9999
              df_discrep: 0.9999
              lambda: 0.97
              df_trans: 0.9999999
              df_covs: 0.9999999
        fit:
          quantiles: [0.05, 0.20, 0.35, 0.50, 0.65, 0.80, 0.95]
          exdqlm_multivar:
            gamma_sigma:
              warmup_freeze_iters: 10
              min_update_iters: 50
              min_total_iters: 50
              max_iter: 100
              convergence_tol: 1.0e-06
              convergence:
                elbo_tol: 1.0e-06
                state_norm_sq_tol: 1.0e-06
                sigma_exp_tol: 1.0e-06
                gamma_exp_tol: 1.0e-06
              freeze_target: gamma_sigma
              guard_refreeze_iters: 10
              init:
                mode: robust
                gamma: 0.0
                sigma_floor: 0.001
                sigma_scale: 1.0
              objective_guard:
                enabled: true
                fail_fast: false
                log_failures: true
                mode: adaptive_freeze
                penalty: 1.0e12
              laplace_split_near_zero:
                enabled: true
                abs_gamma_threshold: 0.05
                rel_support_threshold: 0.02
                zero_margin_abs_gamma: 1.0e-06
                split_on_guard: true
              stabilization:
                state_guard_enabled: true
                state_norm_max_ratio: 25
                state_norm_abs_cap: 1.0e6
                state_guard_start_iter: 1000
                state_guard_refreeze_iters: 20
                state_hold_after_guard_iters: 20
                state_blend_alpha: 1.0
                cov_blend_alpha: 1.0
              terminal_sampling_guard:
                mode: fail_fast
                min_guard_count: 1
                max_guard_lag_iters: 20
                require_frozen: true
              transfer_compare_fast:
                enabled: false
                warmup_freeze_iters: 5
                min_update_iters: 15
                min_total_iters: 20
                max_iter: 20
            latent_ablation:
              mode: cap_e_inv_u
              e_inv_u_cap: 5000
            pseudodata_guard:
              enabled: true
              mode: fail
              report_dir: ''
              caps:
                fff_abs_cap: 1000
                qqq_diag_abs_cap: 10000
                e_s_abs_cap: 1000
                e_s2_abs_cap: 1.0e6
                e_u_abs_cap: 1.0e6
                e_inv_u_abs_cap: 5000
            forecast_health:
              enabled: true
              fail_fast: true
              write_reports: true
              latent_limit: 650
              sigma_limit: 100
              state_limit: 1000
            legacy:
              lam1: 1.0
              lam2: 1.0
              n_samp: 2000
              sims_enabled: true
              use_covariates: true
              forecast_cov:
                c_factor: 1.0
                epsilon: 365.0
              sampling_diagnostics:
                heartbeat_enabled: true
                heartbeat_seconds: 30
                phase_markers_enabled: true
                walltime_seconds: 1800
                member_walltime_seconds: 30
        post:
          figures: true
          export_tables: true
          smoke_fast: true
          force_isolation_smoke_fast: true
        scale_contract:
          canonical_storage_scale: raw_cms
          legacy_fit_input_scale: log1p_cms
          legacy_post_input_scale: log1p_cms
          analysis_scale_fit_internal: log1p_cms
          analysis_scale_post_internal: log1p_cms
          transform_policy: log1p_only
    - cutoff: '20210123'
      family: exdqlm_multivar_keep
      manuscript_label: exAL-M-T1
      config_patch:
        run:
          seed: 20210123
    - cutoff: '20211112'
      family: exdqlm_multivar_keep
      manuscript_label: exAL-M-T1
      config_patch:
        run:
          seed: 20211112
    - cutoff: '20211221'
      family: exdqlm_multivar_keep
      manuscript_label: exAL-M-T1
      config_patch:
        run:
          seed: 20211221
    - cutoff: '20220511'
      family: exdqlm_multivar_keep
      manuscript_label: exAL-M-T1
      config_patch:
        run:
          seed: 20220511
    - cutoff: '20221225'
      family: exdqlm_multivar_keep
      manuscript_label: exAL-M-T1
      config_patch:
        run:
          seed: 20221225
