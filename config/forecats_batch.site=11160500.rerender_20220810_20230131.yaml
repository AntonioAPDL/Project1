# Rerender subset to fix stale USGS/retros cache truncation from earlier run.
#
# Rationale:
# - Prior run reused a cached USGS/retros window that only covered through 2022-09-06.
# - With plot_post_days=28, any cutoff_date >= 2022-08-10 needs USGS beyond 2022-09-06.
# - This rerender overwrites affected figures and rebuilds shared caches up to 2023-02-28.
#
# IMPORTANT: Keeps the same run_id so figures are overwritten in-place.

run:
  out_root: "data/forecats_inputs"
  cache_root: "data/forecats_cache"
  run_id: "20260206_paper_default_latest"
  overwrite: true

site:
  usgs_site: "11160500"
  lat: 37.0443931
  lon: -122.072464
  usgs:
    parameterCd: "00060"
    statCd: "00003"
    start_date: "1979-01-01"

dates:
  intervals:
    - start: "2022-08-10"
      end: "2023-01-31"
  plot_pre_days: 18
  plot_post_days: 28

transforms:
  plot_scale: "log1p_cms"

inputs:
  retros:
    path: "retros_2023-06-01.csv"
    scale: "log1p_cms"

  glofas:
    grib_root: "data/glofas_operational_medium_range/grib"
    var: "dis24"
    data_types:
      control: "cf"
      perturbed: "pf"
    nearest_valid_cell: true
    shift_days: 1
    weighting:
      scheme: "latest"
      alpha: 1.0
      power: -1.001

  nws:
    pkl_path: "results.pkl"
    parse_issue_hour: false
    issue_lookback_days: 40
    weighting:
      scheme: "latest"
      alpha: 1.0
      exponents: {}

plot:
  title: "Observed and Retrospective River Flow\\nwith GloFAS and NWS Forecast Ensembles"
  flood_levels:
    - label: "Major reference"
      value: 14895.73
      unit: "cfs"
    - label: "Minor reference"
      value: 7402.38
      unit: "cfs"
