# Example config: reproduce the Dec 2022 forecats bundle using the legacy precomputed GloFAS file
# (weighted_time_series_custom_filled.csv) as the source of truth.
#
# This is the recommended "exact parity now" option while we finish reconstructing the
# missing steps that produced the legacy file from raw GRIBs.
#
# Run:
#   Rscript scripts/forecats_pipeline.R --config config/forecats_pipeline.example_dec2022_legacy_custom_filled.yaml

run:
  run_id: ""
  out_root: "data/forecats_inputs"
  overwrite: false

site:
  usgs_site: "11160500"
  lat: 37.0443931
  lon: -122.072464
  usgs:
    parameterCd: "00060"
    statCd: "00003"
    start_date: "1979-01-01"

dates:
  cutoff_date: "2022-12-25"
  plot_start: "2022-12-07"
  plot_end: "2023-01-22"

transforms:
  plot_scale: "log_log1p_cms"

inputs:
  retros:
    source: "csv"
    path: "retros_2022-12-25.csv"
    scale: "log1p_cms"

  glofas:
    source: "csv"
    csv:
      path: "weighted_time_series_custom_filled.csv"
      scale: "log1p_cms"

  nws:
    source: "csv"
    csv:
      path: "nws_forecast.csv"
      scale: "log1p_cms"

plot:
  title: "Observed and Retrospective River Flow\nwith GloFAS and NWS Forecast Ensembles"
  markers:
    - date: "2022-12-25"
      label: "Cutoff"
      color: "gray40"
    - date: "2023-01-09"
      label: "Jan 9: Flood"
      color: "#4a235a"

