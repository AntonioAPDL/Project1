# Resume config pinned to an existing partially-built bundle directory.
#
# This is identical to config/forecats_pipeline.example_dec2020.yaml except:
# - run.run_id is fixed to re-use the existing run folder.
#
# Run:
#   Rscript scripts/forecats_pipeline.R --config config/forecats_pipeline.run_20260204_225904.yaml

run:
  run_id: "20260204_225904"
  out_root: "data/forecats_inputs"
  overwrite: false

site:
  usgs_site: "11160500"
  lat: 37.0443931
  lon: -122.072464
  usgs:
    parameterCd: "00060"
    statCd: "00003"
    start_date: "1979-01-01"

dates:
  cutoff_date: "2020-12-20"
  plot_start: "2020-12-01"
  plot_end: "2021-01-04"

transforms:
  plot_scale: "log_log1p_cms"

inputs:
  retros:
    source: "csv"
    path: "retros_2022-12-25.csv"
    scale: "log1p_cms"

  glofas:
    source: "grib"
    grib:
      grib_root: "data/glofas_operational_medium_range/grib"
      var: "dis24"
      data_types:
        control: "cf"
        perturbed: "pf"
      nearest_valid_cell: true
    weighting:
      power: -1.001
      shift_days: 1

  nws:
    source: "pickle"
    pickle:
      path: "results.pkl"
      parse_issue_hour: false
      issue_lookback_days: 40
    weighting:
      exponents:
        "1": 0.0
        "2": 0.3
        "3": 0.6
        "4": 0.9
        "5": 1.2
        "6": 1.5
        "7": 1.8

plot:
  title: "Observed and Retrospective River Flow\nwith GloFAS and NWS Forecast Ensembles"
  markers:
    - date: "2020-12-20"
      label: "Cutoff"
      color: "gray40"

