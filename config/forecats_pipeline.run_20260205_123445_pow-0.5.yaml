# Re-run config pinned to the "power=-0.5" GRIB-based bundle.
#
# This bundle was created by reusing cached issue-date extractions from the baseline run
# to avoid re-reading GRIBs, then reweighting with power=-0.5.
#
# Run (idempotent; will skip if outputs exist):
#   Rscript scripts/forecats_pipeline.R --config config/forecats_pipeline.run_20260205_123445_pow-0.5.yaml

run:
  run_id: "20260205_123445_pow-0.5"
  out_root: "data/forecats_inputs"
  overwrite: false

site:
  usgs_site: "11160500"
  lat: 37.0443931
  lon: -122.072464
  usgs:
    parameterCd: "00060"
    statCd: "00003"
    start_date: "1979-01-01"

dates:
  cutoff_date: "2022-12-25"
  plot_start: "2022-12-07"
  plot_end: "2023-01-22"

transforms:
  plot_scale: "log_log1p_cms"

inputs:
  retros:
    source: "csv"
    path: "retros_2022-12-25.csv"
    scale: "log1p_cms"

  glofas:
    source: "grib"
    grib:
      grib_root: "data/glofas_operational_medium_range/grib"
      var: "dis24"
      data_types:
        control: "cf"
        perturbed: "pf"
      nearest_valid_cell: true
    weighting:
      power: -0.5
      shift_days: 1

  nws:
    source: "csv"
    csv:
      path: "nws_forecast.csv"
      scale: "log1p_cms"

plot:
  title: "Observed and Retrospective River Flow\nwith GloFAS and NWS Forecast Ensembles"
  markers:
    - date: "2022-12-25"
      label: "Cutoff"
      color: "gray40"
    - date: "2023-01-09"
      label: "Jan 9: Flood"
      color: "#4a235a"

