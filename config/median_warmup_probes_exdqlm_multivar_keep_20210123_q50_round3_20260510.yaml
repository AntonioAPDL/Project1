  description: >-
    Third-round median-only warmup screen for the 2021-01-23 exdqlm_multivar_keep relaunch row.
    Rounds one and two ruled out pure freeze-length tuning and ruled out freezing the latent states.
    This round returns to the least-bad gamma/sigma-freeze path from round one and tests whether
    asymmetric gamma seeds can break the median symmetry without triggering the first guarded update.
