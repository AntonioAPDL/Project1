version: v20260527_subset6_noi_soi_espi_pna_whwp_amo
description: Isolated GDPC1 covariate using only NOI, SOI, ESPI, PNA, WHWP, and AMO; does not replace active publication input bundles.
artifact_root: data/canonical_gdpc_subset6_noi_soi_espi_pna_whwp_amo/v20260527
canonical_window:
  start_date: '1987-05-29'
  end_date: '2023-01-22'
monthly_source_window:
  start_month: '1987-01-01'
  end_month: '2023-01-01'
download:
  timeout_seconds: 30
  retries: 3
  user_agent: canonical-gdpc-subset6-climate-pipeline/20260527
postprocess:
