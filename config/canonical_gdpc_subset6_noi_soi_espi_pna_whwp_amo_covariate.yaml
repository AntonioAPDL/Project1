    anchor_index_id: soi
screening:
  enabled: false
  candidate_k_values:
    - 2
  criterion: BIC
  tol: 1.0e-3
  niter_max: 200
  max_runtime_seconds_per_k: 900
  require_convergence: true
  selection_rule:
    primary_metric: criterion_value
    objective: minimize
    require_converged_fit: true
    tie_breakers:
      - lower_runtime_seconds
      - smaller_k
compatibility_aliases:
  - alias_filename: cov_03_PCA.csv
