  description: >-
    Second-round median-only warmup screen for the 2021-01-23 exdqlm_multivar_keep relaunch row.
    Round one showed that longer gamma/sigma freezes alone do not fix the median. This round focuses
    on the remaining meaningful levers: freezing the latent states instead of gamma/sigma during warmup,
    and breaking the median symmetry with nonzero gamma seeds while keeping the tuned HE2 inputs and
    discount block fixed.
