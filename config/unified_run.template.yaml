config_version: 1

run:
  run_id: null
  run_root: "repro/runs"
  repro_mode: "strict"
  seed: 777
  overwrite: false
  dry_run: false
  git_require_clean: false
  io:
    enabled: false               # when true, fail fast if free space/inodes are below thresholds
    min_free_gb: 20              # legacy single-threshold fallback (kept for backward compatibility)
    min_free_gb_start: null      # optional: fit-start comfort threshold (GB)
    min_free_gb_continue: null   # optional: in-run continuation threshold (GB)
    preflight_scope: "legacy"    # legacy | fit_start_and_continue | fit_start_only
    min_free_inodes_pct: 5
  threads:
    omp: 1
    openblas: 1
    mkl: 1
    veclib: 1
    numexpr: 1
    mc_cores: 1

stages:
  forecats: true
  data_prep_shared: false
  fit: true
  post: true
  validate: true
  report: true

models:
  run_exdqlm_multivar: true
  run_exdqlm_univar: false
  run_ndlm_main: false
  exdqlm_multivar:
    implementation_mode: "legacy_bridge"   # legacy_bridge
    forecast_transfer_mode: "drop"         # drop | keep (keep retains transfer block during forecast window)
    # Optional: run both transfer regimes in one unified run (repeats multivar fit/post per mode)
    # forecast_transfer_modes: ["drop", "keep"]
    state_evolution:
      df_t:       0.9999
      df_s1:      0.9995
      df_s2:      0.9995
      df_s67:     0.9999
      df_discrep: 0.992
      lambda:     0.97
      df_trans:   0.99999999
      df_covs:    0.99999999
  exdqlm_univar:
    implementation_mode: "theory_aligned"   # legacy_bridge | theory_aligned
    state_evolution:
      df_t: 0.9999995
      df_s1: 0.9997
      df_s2: 0.9997
      df_s67: 0.9997
      lambda: 0.8995
      df_trans: 0.99999999
      df_covs: 0.99999
  ndlm_main:
    implementation_mode: "theory_aligned"    # legacy_bridge | theory_aligned
    kalman_backend: "cpp"                     # r | cpp
    state_evolution:
      df_t: 0.95
      df_s1: 0.98
      df_s2: 0.98
      df_s67: 0.98
      df_discrep: 0.98
      lambda: 0.99
      df_trans: 0.99999999
      df_covs: 0.99999

site:
  usgs_site: "11160500"
  lat: 37.0443931
  lon: -122.072464

dates:
  cutoff_date: "2022-12-25"
  plot_start: "2022-12-07"
  plot_end: "2023-01-22"
  data_start: null               # optional YYYY-MM-DD; filters shared CSV inputs for debug-small runs

inputs:
  fit:
    parameters_path: null
    retros_path: null
    retros_storage_scale: "log1p_cms"
    nws_forecast_path: null
    nws_storage_scale: "log1p_cms"
    glofas_forecast_path: null
    glofas_storage_scale: "log1p_cms"
    usgs_mode: "live"
    usgs_cache_path: null
    covariates: []   # optional list of {name, path}
  post:
    use_fit_outputs_from_run: true
    source_run_id: null          # optional: reuse fit outputs from an existing run id (post-only replay)
    source_run_root: null        # optional: defaults to run.run_root when source_run_id is set
  forecats:
    mode: "use_existing"
    pipeline_config_path: "config/forecats_pipeline.template.yaml"
    existing_bundle_path: null
    snapshot:
      enabled: null                # null => default true for mode=build, false for mode=use_existing
      dest_rel: "inputs/shared/forecats_bundle"
      copy_list: []                # optional relative paths from bundle root; empty => minimal default set
  shared:
    prefer_forecats_snapshot: true
  deterministic_climate:
    enabled: false
    handoff_root: null             # handoff cache root with catalogs/ and forecast_cache/
    horizon_days: null             # null => derive from run-scoped GloFAS forecast window
    require_full_horizon: true
    precip:
      reduction: "mean"           # mean | median across daily GEFS member totals
    soil:
      reduction: "mean"           # mean | median across daily NWM member averages
  shared_covariates: []            # legacy compatibility: list of covariate paths

fit:
  quantiles: [0.05, 0.2, 0.35, 0.5, 0.65, 0.8, 0.95]
  parallel:
    mode: "one_core_per_model"   # one_core_per_model | global_models | by_family
    workers: null                # used by global_models only; null => run.threads.mc_cores
  warm_start:
    enabled: false
    source_run_id: null
    mode: "resume"
  exdqlm_multivar:
    gamma_sigma:
      warmup_freeze_iters: 5
      min_update_iters: 50          # require at least this many gamma/sigma update iterations before convergence stop
      min_total_iters: 50           # require at least this many total VB iterations before convergence stop
      max_iter: 100
      convergence_tol: 1.0e-6       # legacy alias for ELBO criterion; prefer convergence.elbo_tol
      convergence:
        elbo_tol: 1.0e-6
        state_norm_sq_tol: 1.0e-6
        sigma_exp_tol: 1.0e-6
        gamma_exp_tol: 1.0e-6
      freeze_target: "gamma_sigma"   # gamma_sigma | states
      guard_refreeze_iters: 10       # adaptive guard: additional freeze iterations after a non-finite guard event
      init:
        mode: "robust"               # legacy | robust
        gamma: 0.0                   # robust mode only; clipped to quantile-implied [L,U]
        sigma_floor: 1.0e-3          # robust mode only; lower bound for sigma init
        sigma_scale: 1.0             # robust mode only; multiplier on robust response spread
      objective_guard:
        enabled: true          # set true to penalize non-finite gamma/sigma objective evaluations
        fail_fast: false       # when true + enabled, stop immediately on first non-finite objective
        log_failures: true
        mode: "adaptive_freeze" # penalty | adaptive_freeze
        penalty: 1.0e12
      transfer_compare_fast:
        enabled: false         # when true, override gamma/sigma iteration controls for fast drop-vs-keep comparisons
        warmup_freeze_iters: 5
        min_update_iters: 15
        min_total_iters: 20
        max_iter: 20
    legacy:
      lam1: 0.999999
      lam2: 0.999999
      n_samp: 2000
      sims_enabled: true
      use_covariates: true
      forecast_cov:
        c_factor: 1.0e2            # legacy DISC-W forecast-window covariance prior scaling
  exdqlm_univar:
    gamma_sigma:
      warmup_freeze_iters: 5
      min_update_iters: 50          # require at least this many gamma/sigma update iterations before convergence stop
      min_total_iters: 50           # require at least this many total VB iterations before convergence stop
      max_iter: 100
      convergence_tol: 1.0e-6       # legacy alias for ELBO criterion; prefer convergence.elbo_tol
      convergence:
        elbo_tol: 1.0e-6
        state_norm_sq_tol: 1.0e-6
        sigma_exp_tol: 1.0e-6
        gamma_exp_tol: 1.0e-6
      freeze_target: "gamma_sigma"   # gamma_sigma | states
      guard_refreeze_iters: 10       # adaptive guard: additional freeze iterations after a non-finite guard event
      init:
        mode: "robust"               # legacy | robust
        gamma: 0.0                   # robust mode only; clipped to quantile-implied [L,U]
        sigma_floor: 1.0e-3          # robust mode only; lower bound for sigma init
        sigma_scale: 1.0             # robust mode only; multiplier on robust response spread
      objective_guard:
        enabled: true
        fail_fast: false
        log_failures: true
        mode: "adaptive_freeze"      # penalty | adaptive_freeze
        penalty: 1.0e12
    legacy:
      lam1: 0.9999999999999999
      lam2: 0.9999999999999999
      n_samp: 2000
      sims_enabled: true
      use_covariates: true
  ndlm_main:
    gamma_sigma:
      min_total_iters: 50
      max_iter: 100
      convergence_tol: 1.0e-6       # legacy alias for ELBO criterion; prefer convergence.elbo_tol
      convergence:
        elbo_tol: 1.0e-6
        elbo_rel_tol: 2.5e-4
    legacy:
      lam1: 0.999999
      lam2: 0.9
      n_samp: 2000
      sims_enabled: true
      use_covariates: true
  contract_checks:
    enabled: false
    fail_fast: true
    write_reports: true
  diagnostics:
    enabled: false
    fail_fast: true
    write_reports: true
    max_time_checks: 25
    seed: 777
    psd_tol: -1.0e-10

post:
  figures: true
  profile: false
  profile_detail: false
  allow_legacy_root_fallback: false  # deprecated compatibility path; removed from production/proof validation contracts
  export_tables: true
  table_formats: ["csv"]        # supported: csv, rds

validation:
  profile: "production"          # production | production_proof | smoke
  canonical_run_id: null
  compare:
    mode: "both"                 # hash | pixel | both | none
    numeric_abs_tol: 0.0
    numeric_rel_tol: 0.0
    pixel_max_abs_tol: 0.0

scale_contract:
  canonical_storage_scale: "raw_cms"
  legacy_fit_input_scale: "log1p_cms"
  legacy_post_input_scale: "log1p_cms"
  analysis_scale_fit_internal: "log_log1p_cms"
  analysis_scale_post_internal: "log_log1p_cms"

write_audit:
  enabled: true
  enforce_from_stage: 4          # production default; use 2 for migration/proof runs that must audit fit+post writes
  allowlist_outside_run_root: []
