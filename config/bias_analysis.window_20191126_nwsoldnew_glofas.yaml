run:
  run_id: bias_window_20191126_nwsoldnew_glofas
  out_root: repro/bias_runs
  overwrite: true

inputs:
  forecats_root: data/forecats_inputs/site=11160500
  retros_path: repro/bias_inputs/retros_2023-06-01_with_nws21_raw_cms.csv
  retros_scale: raw_cms
  usgs_col: USGS
  run_id_selector: latest_mtime
  explicit_run_id: null

analysis:
  horizons_days: [1, 7]
  intervals:
    - start: "2019-11-19"
      end: "2019-12-03"

centers:
  - key: NWS_OLD
    label: NWS/NWM (retro 2.1)
    retros_col: NWS2.1
    forecast_file: nws_weighted_daily.csv
  - key: NWS_NEW
    label: NWS/NWM (retro 3.0)
    retros_col: NWS3.0
    forecast_file: nws_weighted_daily.csv
  - key: GLOFAS
    label: GloFAS
    retros_col: GloFAS
    forecast_file: glofas_weighted_daily.csv

plots:
  dpi: 180
  width: 14
  height: 7
  line_width: 0.9
  marker_size: 3.0
  y_limits_cms: [-30, 30]
  scatter_limits_cms: [-30, 30]
  center_palette:
    - "#1f77b4"
    - "#9467bd"
    - "#ff7f0e"
  center_groups: null
