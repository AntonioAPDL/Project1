config_version: 1

run:
  run_id: "diag_ndlm_only_calib_r01_20260225_003151"
  run_root: "repro/runs"
  repro_mode: "strict"
  seed: 777
  overwrite: true
  dry_run: false
  git_require_clean: false
  threads:
    omp: 1
    openblas: 1
    mkl: 1
    veclib: 1
    numexpr: 1
    mc_cores: 1

stages:
  forecats: false
  data_prep_shared: true
  fit: true
  post: true
  validate: true
  report: true

models:
  run_exdqlm_multivar: false
  run_exdqlm_univar: false
  run_ndlm_main: true
  exdqlm_univar:
    implementation_mode: "theory_aligned"
  ndlm_main:
    implementation_mode: "theory_aligned"
    kalman_backend: "cpp"

site:
  usgs_site: "11160500"
  lat: 37.0443931
  lon: -122.072464

dates:
  cutoff_date: "2022-12-25"
  plot_start: "2022-12-07"
  plot_end: "2023-01-22"
  data_start: "2010-01-01"

inputs:
  fit:
    parameters_path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/parameters/parameters.txt"
    retros_path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/retros/retros.csv"
    retros_storage_scale: "log1p_cms"
    nws_forecast_path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/forecasts/nws_forecast.csv"
    nws_storage_scale: "raw_cms"
    glofas_forecast_path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/forecasts/glofas_forecast.csv"
    glofas_storage_scale: "raw_cms"
    usgs_mode: "live"
    usgs_cache_path: null
    covariates:
      - name: "ELI"
        path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/covariates/cov_01_ELI.csv"
      - name: "ONI"
        path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/covariates/cov_02_ONI.csv"
      - name: "PPT"
        path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/covariates/cov_03_PPT.csv"
      - name: "SOIL"
        path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/covariates/cov_04_SOIL.csv"
      - name: "PCA"
        path: "repro/runs/prod_canonical_full_e2e_parallel_onecore_refresh_20260221/inputs/shared/covariates/cov_05_PCA.csv"
  post:
    use_fit_outputs_from_run: true

fit:
  parallel:
    mode: "one_core_per_model"
    workers: null
  quantiles: [0.50]
  ndlm_main:
    gamma_sigma:
      min_total_iters: 50
      max_iter: 800
      convergence_tol: 1.0e-6
      convergence:
        elbo_tol: 1.0e-6
        elbo_rel_tol: 2.5e-4
  contract_checks:
    enabled: true
    fail_fast: true
    write_reports: true
  diagnostics:
    enabled: true
    fail_fast: true
    write_reports: true
    max_time_checks: 25
    seed: 777
    psd_tol: -1.0e-10

post:
  figures: true
  smoke_fast: false
  profile: false
  profile_detail: false
  allow_legacy_root_fallback: false
  sort_keep_na: true
  export_tables: true

validation:
  profile: "smoke"
  canonical_run_id: "__SELF__"
  compare:
    mode: "hash"
    numeric_abs_tol: 0.0
    numeric_rel_tol: 0.0
    pixel_max_abs_tol: 0.0

scale_contract:
  canonical_storage_scale: "raw_cms"
  legacy_fit_input_scale: "log1p_cms"
  legacy_post_input_scale: "log1p_cms"
  analysis_scale_fit_internal: "log_log1p_cms"
  analysis_scale_post_internal: "log_log1p_cms"

write_audit:
  enabled: true
  enforce_from_stage: 4
  allowlist_outside_run_root: []
