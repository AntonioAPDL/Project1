config_version: 1
run:
  run_id: repair_r1_ndlm_main_drop_scale003_20210123_20260326
  run_root: repro/runs
  repro_mode: strict
  seed: 777
  overwrite: no
  auto_suffix_on_collision: yes
  dry_run: no
  git_require_clean: no
  threads:
    omp: 1
    openblas: 1
    mkl: 1
    veclib: 1
    numexpr: 1
    mc_cores: 1
stages:
  forecats: no
  data_prep_shared: yes
  fit: yes
  post: yes
  validate: no
  report: yes
site:
  usgs_site: '11160500'
  lat: 37.0443931
  lon: -122.072464
dates:
  cutoff_date: '2021-01-23'
  plot_start: '2021-01-05'
  plot_end: '2021-02-20'
  data_start: '2010-01-01'
inputs:
  fit:
    parameters_path: /data/muscat_data/jaguir26/projects/Project/Input/exAL/parameters/parameters.txt
    retros_path: /data/muscat_data/jaguir26/project1_ucsc_phd/repro/runs/multimodel_20210123/inputs/shared/forecats_bundle/retros.csv
    retros_storage_scale: log1p_cms
    nws_forecast_path: /data/muscat_data/jaguir26/project1_ucsc_phd/repro/runs/multimodel_20210123/inputs/shared/forecats_bundle/nws_forecast.csv
    nws_storage_scale: raw_cms
    glofas_forecast_path: /data/muscat_data/jaguir26/project1_ucsc_phd/repro/runs/multimodel_20210123/inputs/shared/forecats_bundle/glofas_forecast.csv
    glofas_storage_scale: raw_cms
    usgs_mode: live
    usgs_cache_path: ~
    covariates:
    - name: ELI
      path: /data/muscat_data/jaguir26/projects/Project/Input/exAL/covariates/cov_1_ELI.csv
    - name: ONI
      path: /data/muscat_data/jaguir26/projects/Project/Input/exAL/covariates/cov_2_ONI.csv
    - name: PPT
      path: /data/muscat_data/jaguir26/project1_ucsc_phd/prism_precipitation_santa_cruz_1987_2023.csv
    - name: SOIL
      path: /data/muscat_data/jaguir26/project1_ucsc_phd/soil_moisture_data/soil_moisture_big_trees_daily_avg_1987_2023.csv
    - name: PCA
      path: /data/muscat_data/jaguir26/project1_ucsc_phd/pca.csv
  post:
    use_fit_outputs_from_run: yes
  forecats:
    mode: use_existing
    pipeline_config_path: config/forecats_pipeline.template.yaml
    existing_bundle_path: ~
    snapshot:
      enabled: no
  shared:
    prefer_forecats_snapshot: no
post:
  figures: yes
  smoke_fast: no
  force_isolation_smoke_fast: no
  profile: no
  profile_detail: no
  allow_legacy_root_fallback: no
  sort_keep_na: yes
  export_tables: yes
  table_formats:
  - csv
  crps_input_health:
    enabled: yes
    fail_fast: yes
    min_finite_share: 1.0
    max_abs: .na.real
validation:
  profile: smoke
  canonical_run_id: __SELF__
  compare:
    mode: none
    numeric_abs_tol: 0.0
    numeric_rel_tol: 0.0
    pixel_max_abs_tol: 0.0
scale_contract:
  canonical_storage_scale: raw_cms
  legacy_fit_input_scale: log1p_cms
  legacy_post_input_scale: log1p_cms
  analysis_scale_fit_internal: log_log1p_cms
  analysis_scale_post_internal: log_log1p_cms
write_audit:
  enabled: yes
  enforce_from_stage: 4
  allowlist_outside_run_root: []
models:
  run_exdqlm_multivar: no
  run_exdqlm_univar: no
  run_ndlm_main: yes
  run_ndlm_univar: no
  ndlm_main:
    implementation_mode: theory_aligned
    kalman_backend: cpp
    forecast_transfer_mode: drop
fit:
  quantiles: [0.50]
  parallel:
    mode: one_core_per_model
  warm_start:
    enabled: no
    mode: resume
  ndlm_main:
    gamma_sigma:
      min_total_iters: 50
      max_iter: 100
      convergence_tol: 1.0e-06
      convergence:
        elbo_tol: 1.0e-06
        elbo_rel_tol: 0.00025
  contract_checks:
    enabled: yes
    fail_fast: yes
    write_reports: yes
  diagnostics:
    enabled: yes
    fail_fast: yes
    write_reports: yes
    max_time_checks: 5000
    seed: 777
    psd_tol: -1.0e-08
