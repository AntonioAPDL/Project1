run:
  run_id: null
  out_root: repro/bias_runs
  overwrite: false

inputs:
  forecats_root: data/forecats_inputs/site=11160500
  retros_path: retros_2023-06-01.csv
  retros_scale: log1p_cms
  usgs_col: USGS

  # Options: latest_mtime | explicit
  run_id_selector: latest_mtime
  # Used only when run_id_selector=explicit
  explicit_run_id: null

analysis:
  horizons_days: [1, 7]
  intervals:
    - start: "2019-11-05"
      end: "2020-03-11"
    - start: "2020-03-17"
      end: "2020-07-28"
    - start: "2020-07-30"
      end: "2020-11-13"
    - start: "2020-11-15"
      end: "2022-07-13"
    - start: "2022-07-15"
      end: "2023-01-31"

centers:
  - key: NWS_NWM
    label: NWS/NWM
    retros_col: NWS3.0
    forecast_file: nws_weighted_daily.csv
  - key: GLOFAS
    label: GloFAS
    retros_col: GloFAS
    forecast_file: glofas_weighted_daily.csv

plots:
  dpi: 180
  width: 14
  height: 7
  line_width: 0.9
  marker_size: 3.0
  y_limits_cms: [-30, 30]
  scatter_limits_cms: [-30, 30]
  center_palette:
    - "#1f77b4"
    - "#ff7f0e"
    - "#2ca02c"
    - "#9467bd"

  # Optional explicit group definitions. If null, defaults are:
  # - all centers
  # - one group per center
  center_groups: null
  # Example:
  # center_groups:
  #   - key: all
  #     label: All centers
  #     centers: [NWS_NWM, GLOFAS]
  #   - key: nws_only
  #     label: NWS/NWM only
  #     centers: [NWS_NWM]
  #   - key: glofas_only
  #     label: GloFAS only
  #     centers: [GLOFAS]
